name: MLSD CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:

  build-and-push:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt
          pip install dvc dvc-http

      - name: Configure DVC Remote
        run: |
          dvc remote add -d origin https://dagshub.com/rahulnathani2006/mlsd-courseproject.dvc
          dvc remote modify origin auth basic
          dvc remote modify origin user ${{ secrets.DAGSHUB_USERNAME }}
          dvc remote modify origin password ${{ secrets.DAGSHUB_TOKEN }}

      - name: Pull Dataset from DVC Remote
        run: |
          dvc pull

      - name: Run Training Pipeline
        run: |
          python src/train.py

      - name: Run Prediction Test
        run: |
          python src/predict.py

      - name: Build Docker Image
        run: |
          docker build -t nathanirahul/mlsd-grid-api:latest .

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Push Docker Image
        run: |
          docker push nathanirahul/mlsd-grid-api:latest
